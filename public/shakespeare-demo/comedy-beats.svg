<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Romantic comedy beat structure</title>
  <desc id="desc">A curved beat map of romantic comedy from mistaken identity to public resolution.</desc>
  <rect width="960" height="640" fill="#f7f8fb"/>
  <rect x="92" y="78" width="776" height="486" rx="28" fill="#ffffff" stroke="#c9d4e2" stroke-width="4"/>
  <path d="M164 428C266 248 388 210 480 314s214 78 316-100" fill="none" stroke="#3a6ea0" stroke-width="12" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="700" fill="#27313f">
    <circle cx="164" cy="428" r="28" fill="#dbe8f6" stroke="#3a6ea0" stroke-width="5"/>
    <text x="164" y="488" text-anchor="middle" font-size="17">Meet</text>
    <circle cx="310" cy="266" r="28" fill="#f0e8cc" stroke="#a89450" stroke-width="5"/>
    <text x="310" y="226" text-anchor="middle" font-size="17">Disguise</text>
    <circle cx="480" cy="314" r="28" fill="#d6ede3" stroke="#5c9970" stroke-width="5"/>
    <text x="480" y="374" text-anchor="middle" font-size="17">Obstacle</text>
    <circle cx="642" cy="306" r="28" fill="#f0d8d8" stroke="#b87070" stroke-width="5"/>
    <text x="642" y="266" text-anchor="middle" font-size="17">Crisis</text>
    <circle cx="796" cy="214" r="28" fill="#e7e2f0" stroke="#7d6aa8" stroke-width="5"/>
    <text x="796" y="176" text-anchor="middle" font-size="17">Reveal</text>
  </g>
  <text x="480" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#27313f">How Comedy Moves Toward Recognition</text>
  <text x="480" y="532" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#5b6572">meet-cute, disguise, blocking force, reversal, public ending</text>
</svg>
