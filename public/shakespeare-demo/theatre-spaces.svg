  <ellipse cx="480" cy="336" rx="196" ry="128" fill="#ffffff" stroke="#d8c891" stroke-width="8"/>
  <rect x="352" y="218" width="256" height="88" rx="12" fill="#dbe8f6" stroke="#3a6ea0" stroke-width="6"/>
