<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Authorship network</title>
  <desc id="desc">A concept network connecting Shakespeare, Marlowe, patronage, print, and performance.</desc>
  <rect width="960" height="640" fill="#f7f8fb"/>
  <rect x="88" y="74" width="784" height="492" rx="30" fill="#ffffff" stroke="#c9d4e2" stroke-width="4"/>
  <path d="M302 194L512 136L684 248L625 429L388 458L253 326Z" fill="none" stroke="#9eb9da" stroke-width="9"/>
  <path d="M302 194L684 248M512 136L388 458M253 326L625 429" stroke="#d7e2ef" stroke-width="7"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="700">
    <circle cx="302" cy="194" r="62" fill="#dbe8f6" stroke="#3a6ea0" stroke-width="5"/>
    <text x="302" y="200" text-anchor="middle" font-size="20" fill="#27313f">Shakespeare</text>
    <circle cx="512" cy="136" r="56" fill="#f0e8cc" stroke="#a89450" stroke-width="5"/>
    <text x="512" y="142" text-anchor="middle" font-size="20" fill="#27313f">Marlowe</text>
    <circle cx="684" cy="248" r="58" fill="#d6ede3" stroke="#5c9970" stroke-width="5"/>
    <text x="684" y="254" text-anchor="middle" font-size="20" fill="#27313f">Patrons</text>
    <circle cx="625" cy="429" r="58" fill="#f0d8d8" stroke="#b87070" stroke-width="5"/>
    <text x="625" y="435" text-anchor="middle" font-size="20" fill="#27313f">Theatre</text>
    <circle cx="388" cy="458" r="58" fill="#e7e2f0" stroke="#7d6aa8" stroke-width="5"/>
    <text x="388" y="464" text-anchor="middle" font-size="20" fill="#27313f">Print</text>
    <circle cx="253" cy="326" r="58" fill="#eef1f5" stroke="#6f7c8f" stroke-width="5"/>
    <text x="253" y="332" text-anchor="middle" font-size="20" fill="#27313f">Rumour</text>
  </g>
  <text x="480" y="102" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#27313f">Who Gets To Be Called The Author?</text>
  <text x="480" y="535" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#5b6572">rivalry, collaboration, patronage, evidence, mythmaking</text>
</svg>
